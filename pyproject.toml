[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensecast"
version = "1.0.0"
description = "Multimodal retail demand sensing from sales, weather, events and search trends (BDS-32 capstone)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "scipy>=1.12", "pyarrow>=15", "lightgbm>=4.3", "pandera>=0.20",
    "holidays>=0.50", "PyYAML>=6", "matplotlib>=3.8", "fastapi>=0.110", "uvicorn>=0.29",
    "pydantic>=2.6", "prometheus-client>=0.20", "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "altair>=5"]
tracking = ["mlflow-skinny>=2.12"]
dev = ["pytest>=8", "ruff>=0.5", "pip-audit>=2.7"]

[project.scripts]
sensecast = "sensecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S311", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that run the small pipeline"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
