name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests dashboard
      - name: Tests (unit, leakage, faults, integration)
        run: pytest --junitxml=test-results.xml
      - name: Smoke run of the whole pipeline (small profile)
        env:
          SENSECAST_DATA_DIR: ${{ runner.temp }}/data
          SENSECAST_ARTIFACTS: ${{ runner.temp }}/artifacts
          SENSECAST_REPORTS: ${{ runner.temp }}/reports
        run: python -m sensecast.cli all --profile small
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-smoke-results
          path: |
            test-results.xml
            ${{ runner.temp }}/reports/results.md
            ${{ runner.temp }}/artifacts/gates.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sensecast:${{ github.sha }} .
      - name: Container smoke test
        run: |
          docker run --rm -e SENSECAST_CONFIG=small sensecast:${{ github.sha }} python -m sensecast.cli all --profile small
